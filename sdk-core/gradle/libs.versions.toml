[versions]
agp = "9.2.1"
kotlin = "1.8.22" # Published stdlib and metadata compatibility baseline.
kotlinCompilerPlugin = "2.2.10"
nexusPublish = "2.0.0"
dokka = "2.2.0"

#SDK Core
kotlinx-coroutines = "1.7.3" # 1.8.1
kotlinx-serialization = "1.5.1" # 1.6.3
okio = "3.4.0" # 3.9.1
okhttp = "4.11.0" # 4.12.0
datastore-preferences = "1.1.7"
activity = "1.10.1"
lifecycle = "2.8.7"
credentials = "1.3.0" # 1.5.0
webkit = "1.14.0"

#SDK Tests
junit4 = "4.13.2"
androidx-junit4 = "1.3.0"
espressoCore = "3.7.0"
truth = "1.4.5"
mockk = "1.13.17"
robolectric = "4.17-beta-2"

[libraries]

#SDK Core
kotlin-stdlibJdk8 = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }
kotlinx-coroutinesCore = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutinesAndroid = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "activity" }
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }
androidx-credentialsplayServices = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentials" }
androidx-datastorePreferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore-preferences" }
androidx-lifecycleCommon = { module = "androidx.lifecycle:lifecycle-common", version.ref = "lifecycle" }
androidx-lifecycleRuntime = { module = "androidx.lifecycle:lifecycle-runtime", version.ref = "lifecycle" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }

#SDK Tests
junit = { module = "junit:junit", version.ref = "junit4" }
kotlinxCoroutinesTest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

[plugins]
androidLibrary = { id = "com.android.library", version.ref = "agp" }
kotlinxSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlinCompilerPlugin" }
nexusPublish = { id = "io.github.gradle-nexus.publish-plugin", version.ref = "nexusPublish" }
dokkaJavadoc = { id = "org.jetbrains.dokka-javadoc", version.ref = "dokka" }
